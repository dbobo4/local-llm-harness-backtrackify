<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backtrackify Chat</title>
<style>
:root{color-scheme:dark;--bg:#0c1420;--sidebar:#101b29;--surface:#142131;--raised:#1a2b3e;--user:#163248;--text:#e8eef5;--muted:#9aadc0;--line:#293b4e;--accent:#75d4ed;--accent-ink:#092333;--good:#91d7ac;--bad:#ffacac;--code:#09121d;--focus:#7ad7f0}
:root[data-theme=light]{color-scheme:light;--bg:#f7f9fc;--sidebar:#edf2f7;--surface:#fff;--raised:#e4edf5;--user:#e1f1fa;--text:#192b3d;--muted:#51667c;--line:#ccd8e4;--accent:#126a89;--accent-ink:#fff;--good:#23713f;--bad:#b52b38;--code:#eef3f8;--focus:#147eaa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
button,textarea,input{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.55}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
button{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);padding:8px 12px}
button:hover:not(:disabled){background:var(--raised)}
.app{display:grid;grid-template-columns:252px minmax(0,1fr);height:100vh;height:100dvh;overflow:hidden}
aside{display:flex;flex-direction:column;min-height:0;padding:22px 14px;background:var(--sidebar);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 24px;font-size:17px;font-weight:650;letter-spacing:-.3px}
.brand-mark{display:grid;place-items:center;width:30px;height:30px;border:1px solid var(--accent);border-radius:8px;color:var(--accent);font-size:17px}
.brand small{display:block;color:var(--muted);font-size:10px;font-weight:500;letter-spacing:1.8px;line-height:1.1}
#new{width:100%;text-align:left;color:var(--accent);border-color:var(--line);padding:10px 13px}
#new span{padding-right:8px;font-size:19px;line-height:1}
.sidebar-label{margin:25px 10px 9px;color:var(--muted);font-size:11px;letter-spacing:1.2px;text-transform:uppercase}
nav{overflow-y:auto;min-height:0;flex:1}.conversation-row{display:grid;grid-template-columns:minmax(0,1fr) 30px;gap:4px;align-items:center;margin:3px 0}
nav button{border-color:transparent;background:transparent;font-size:13px;min-width:0}
nav .conversation-select{text-align:left;padding:10px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav .menu-toggle{display:grid;place-items:center;width:30px;height:30px;padding:0;overflow:visible;text-overflow:clip}
.menu-dots{display:flex;gap:3px;align-items:center}.menu-dots i{display:block;width:3px;height:3px;border-radius:50%;background:currentColor}
.conversation-menu{position:fixed;inset:auto;margin:0;padding:5px;width:164px;max-width:calc(100vw - 16px);border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);box-shadow:0 8px 24px #0005}
.conversation-menu button{display:block;width:100%;text-align:left;padding:8px 12px;border:0;background:transparent;font-size:13px}.conversation-menu button:hover,.conversation-menu button:focus-visible{background:var(--raised)}.delete-action{color:var(--bad)}
#delete-all{flex-shrink:0;margin-top:12px;padding:11px 10px 0;border:0;border-top:1px solid var(--line);border-radius:0;background:transparent;text-align:left;font-size:12px;color:var(--bad)}
nav button[aria-pressed=true]{background:var(--raised);border-color:var(--line);box-shadow:inset 2px 0 var(--accent);color:var(--accent)}
nav button[data-unavailable=true]{color:var(--bad)}
main{display:grid;grid-template-rows:auto minmax(0,1fr);min-width:0;min-height:0}
#chat-content{display:grid;grid-template-rows:minmax(0,1fr) auto;min-width:0;min-height:0;position:relative}
#chat-content[data-drag=true]::after{content:'Drop PNG or JPEG images';position:absolute;inset:8px;z-index:2;display:grid;place-items:center;border:2px dashed var(--accent);border-radius:12px;background:var(--bg);opacity:.92;color:var(--accent);pointer-events:none}
.topbar{display:flex;align-items:center;gap:16px;padding:18px 28px;border-bottom:1px solid var(--line);min-height:78px}
.title{min-width:0;flex:1}.title h1{font-size:16px;line-height:1.4;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.title small{color:var(--muted);font-size:12px}
.connection{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);white-space:nowrap}
.connection::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.connection[data-state=good],#status[data-state=good]{color:var(--good)}
.connection[data-state=error],#status[data-state=error]{color:var(--bad)}
#theme{font-size:12px;white-space:nowrap;padding:7px 10px;background:transparent}
#sidebar-toggle{display:none;font-size:12px}
.timeline{overflow-y:auto;min-height:0;overscroll-behavior:contain;scrollbar-gutter:stable;overflow-anchor:none}
#history{max-width:900px;margin:auto;padding:30px 28px 36px;display:flex;flex-direction:column;gap:22px;min-height:100%}
.empty{margin:auto;text-align:center;max-width:430px;padding:32px 0;color:var(--muted)}
.empty .brand-mark{margin:0 auto 18px;width:40px;height:40px}.empty h2{font-size:23px;font-weight:550;letter-spacing:-.5px;color:var(--text);margin:0 0 8px}.empty p{margin:0}
.message{max-width:100%;min-width:0;border:1px solid var(--line);border-radius:13px;padding:16px 19px;background:var(--surface)}
.message.user{align-self:flex-end;max-width:86%;background:var(--user);border-radius:13px 13px 3px 13px}
.message.assistant{align-self:stretch;border-radius:13px 13px 13px 3px}
.message-role{font-size:11px;font-weight:650;letter-spacing:.6px;margin-bottom:7px;color:var(--muted)}
.assistant .message-role{color:var(--accent)}
.message-body{min-width:0;overflow-wrap:anywhere}
.message-body p{margin:0 0 13px;white-space:pre-wrap}.message-body>:last-child{margin-bottom:0}
.message-body h2,.message-body h3,.message-body h4,.message-body h5,.message-body h6{font-size:1.08em;line-height:1.5;margin:18px 0 8px;font-weight:650}.message-body>:first-child{margin-top:0}
.message-body ul,.message-body ol{padding-left:23px;margin:8px 0 14px}.message-body li{padding:2px 0;white-space:pre-wrap}
code{font:13px/1.65 ui-monospace,"Cascadia Code",Consolas,monospace}
:not(pre)>code{background:var(--code);border:1px solid var(--line);border-radius:4px;padding:1px 5px;white-space:break-spaces}
.code-frame{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:14px 0;min-width:0;background:var(--code)}
.code-bar{display:flex;justify-content:space-between;align-items:center;padding:5px 11px;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted)}
.copy{font-size:11px;padding:2px 8px;border-color:transparent;background:transparent}
pre{margin:0;padding:14px 15px;overflow-x:auto;white-space:pre;tab-size:4;max-width:100%}
.composer-area{padding:14px 28px 20px;border-top:1px solid var(--line);background:var(--bg)}
form{max-width:844px;margin:0 auto}
.input-box{border:1px solid var(--line);border-radius:11px;background:var(--surface);padding:3px 13px}
.input-box:focus-within{border-color:var(--accent)}
textarea{display:block;width:100%;min-height:78px;max-height:180px;resize:vertical;border:0;outline:0!important;background:transparent;color:var(--text);padding:10px 0;font-size:14px;line-height:1.6}
textarea::placeholder{color:var(--muted)}
.composer-bottom{display:flex;align-items:center;gap:14px;margin-top:11px;min-height:38px}
.composer-meta{flex:1;min-width:0;font-size:12px;color:var(--muted)}
#status{display:block;overflow-wrap:anywhere}#composer-help{display:block;font-size:11px;margin-top:2px}
#send{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:650;min-width:105px;padding:9px 16px}
#send:hover:not(:disabled){filter:brightness(1.08)}
.send-area{text-align:right}.context-stats{font-size:10px;color:var(--muted);margin:0 0 5px;white-space:nowrap}
.header-area{min-width:0}.error-notice{display:flex;gap:14px;align-items:center;margin:0 28px 12px;padding:10px 12px;border:1px solid var(--bad);border-radius:8px;color:var(--bad);font-size:13px;overflow-wrap:anywhere}.error-notice[hidden]{display:none}.error-notice span{flex:1;min-width:0}.error-notice button{border:0;background:transparent;color:inherit;padding:0 5px;font-size:18px}
#older{align-self:center;font-size:12px;padding:5px 12px}#older[hidden]{display:none}
dialog{width:min(420px,calc(100% - 32px));background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:22px}dialog::backdrop{background:#0008}dialog h2{font-size:18px;margin:0 0 12px}dialog p{font-size:13px;color:var(--muted)}dialog input{width:100%;padding:9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--text)}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
@media(max-width:820px){.app{grid-template-columns:215px minmax(0,1fr)}.topbar{padding:15px 20px;gap:10px}.connection{font-size:11px}#history{padding:23px 20px}.composer-area{padding:13px 20px 17px}}
@media(max-width:620px){.app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}aside{display:none;max-height:36vh;border-right:0;border-bottom:1px solid var(--line);padding:12px 16px}.app[data-sidebar=open] aside{display:flex}.brand,.sidebar-label{display:none}#new{padding:7px 10px;margin-bottom:6px}nav button{padding:7px 10px;margin:0}main{grid-row:2}.topbar{padding:12px 14px;gap:9px;min-height:66px;flex-wrap:wrap}.title{order:-1;flex-basis:calc(100% - 135px)}#theme{order:-1}#sidebar-toggle{display:block}.connection{margin-left:auto}.title h1{font-size:15px}.title small{display:block;font-size:10px}#history{padding:20px 14px;gap:16px}.message{padding:13px 14px}.message.user{max-width:92%}.composer-area{padding:10px 14px 13px}#composer-help{font-size:10px}.empty h2{font-size:21px}#send{min-width:88px;padding:9px 12px}}
.image-drafts,.message-images{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.image-draft{position:relative}.image-draft img{width:80px;height:64px;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:var(--code)}.image-draft button{position:absolute;right:0;top:0;padding:0 5px;background:var(--surface);font-size:12px}
#attach{padding:4px 9px;font-size:12px;color:var(--accent);margin-bottom:7px}
.message-image{display:flex;flex-direction:column;gap:4px}.message-image img{max-width:180px;max-height:140px;object-fit:contain;border-radius:7px}.message-image button{padding:3px 8px;font-size:11px}.message-image small{color:var(--bad)}
#image-view img{display:block;max-width:min(85vw,1200px);max-height:78vh;object-fit:contain}#image-view button{margin-top:10px}
</style>
</head>
<body>
<div class="app" id="app">
<aside id="sidebar" aria-label="Conversation sidebar">
  <div class="brand"><span class="brand-mark" aria-hidden="true">B</span><div>Backtrackify<small>LOCAL CHAT</small></div></div>
  <button id="new" type="button"><span aria-hidden="true">+</span>New conversation</button>
  <div class="sidebar-label">Conversations</div>
  <nav aria-label="Conversations"></nav>
  <button id="delete-all" type="button" disabled>Delete all chats</button>
</aside>
<main>
  <div class="header-area"><header class="topbar">
    <div class="title"><h1 id="title">Backtrackify Chat</h1><small id="started">Start time unavailable</small></div>
    <button id="theme" type="button" aria-label="Change color theme">Theme: Dark</button>
    <button id="sidebar-toggle" type="button" aria-controls="sidebar" aria-expanded="false">Conversations</button>
    <span class="connection" id="connection" title="Local Chat API connection; not a model health check">Local Chat</span>
  </header><div class="error-notice" id="error-notice" role="alert" hidden><span id="error-text"></span><button id="error-close" type="button" aria-label="Dismiss error">×</button></div></div>
  <div id="chat-content"><div class="timeline" id="timeline"><div id="history" role="log" aria-label="Conversation history"></div></div>
  <div class="composer-area">
    <form>
      <button id="attach" type="button" disabled>+ Image</button><input id="image-files" type="file" accept="image/png,image/jpeg" multiple hidden>
      <div id="image-drafts" class="image-drafts" aria-label="Attached images"></div>
      <div class="input-box"><textarea rows="3" aria-label="Your message" aria-describedby="status composer-help" placeholder="Message Backtrackify…" required></textarea></div>
      <div class="composer-bottom">
        <div class="composer-meta"><span id="status" role="status" aria-live="polite">Loading conversations…</span><span id="composer-help">Enter to send · Shift+Enter for a new line</span></div>
        <div class="send-area"><div class="context-stats" title="Saved active prompt: original goal, summary and retained messages, measured with the native template/tokenizer. Excludes the archive and unsent draft. Output reservation and safety headroom can trigger rollover below 100%; this is not GPU memory or KV-cache usage."><span id="context">Context —</span> · <span id="rollovers">Rollovers 0</span></div><button id="send" type="submit" disabled>Send message</button></div>
      </div>
    </form>
  </div>
  </div>
</main>
</div>
<div id="conversation-menu" class="conversation-menu" popover="auto" role="menu" aria-label="Conversation actions"><button id="menu-rename" type="button" role="menuitem">Rename</button><button id="menu-delete" class="delete-action" type="button" role="menuitem">Delete</button></div>
<dialog id="manage"><h2 id="manage-title"></h2><p id="manage-description"></p><input id="rename-title" aria-label="Conversation title" maxlength="120"><div class="dialog-actions"><button id="manage-cancel" type="button">Cancel</button><button id="manage-confirm" type="button">Save</button></div></dialog>
<dialog id="image-view" aria-label="Attached image"><img alt="Attached image"><button type="button">Close</button></dialog>
<script>
const form=document.querySelector('form'),input=document.querySelector('textarea'),view=document.querySelector('#history');
const label=document.querySelector('#status'),nav=document.querySelector('nav'),send=document.querySelector('#send');
const fresh=document.querySelector('#new'),title=document.querySelector('#title'),connection=document.querySelector('#connection');
const tokenKey='backtrackify.chat.token',activeKey='backtrackify.chat.active',themeKey='backtrackify.chat.theme';
function stored(area,key){try{return window[area].getItem(key)||'';}catch{return '';}}
function remember(area,key,value){try{window[area].setItem(key,value);return true;}catch{return false;}}
const supplied=location.hash.slice(1),token=supplied||stored('sessionStorage',tokenKey);
// Remove the fragment only after this tab can recover it on refresh.
if(supplied&&remember('sessionStorage',tokenKey,supplied))window.history.replaceState(null,'',location.pathname+location.search);
// A new printed link in this tab can be a same-document fragment navigation.
window.addEventListener('hashchange',()=>{if(location.hash)location.reload();});
let active=null,loaded=false,pending=null,selection=0,creating=false,authorized=Boolean(token),conversations=[];
const drafts=new Map(),pageSize=40,timeline=document.querySelector('#timeline');
let shownStart=0,shownEnd=0,olderBusy=false,currentRevision='',managing=null,listRevision='';
let themeMode=stored('localStorage',themeKey)||'dark';
function applyTheme(mode,persist=false){
  themeMode=mode==='light'?'light':'dark';
  document.documentElement.dataset.theme=themeMode;
  document.querySelector('#theme').textContent='Theme: '+themeMode[0].toUpperCase()+themeMode.slice(1);
  if(persist)remember('localStorage',themeKey,themeMode);
}
applyTheme(themeMode);
document.querySelector('#theme').onclick=()=>applyTheme(themeMode==='dark'?'light':'dark',true);
function setStatus(text,state=''){label.textContent=text;label.dataset.state=state;}
function setConnection(text,state=''){connection.textContent=text;connection.dataset.state=state;}
function controls(){send.disabled=!authorized||!active||!loaded||Boolean(pending)||!input.value.trim();fresh.disabled=!authorized||creating;send.textContent=pending?'Generating…':'Send message';document.querySelector('#delete-all').disabled=!authorized||!conversations.length||Boolean(pending)||creating;document.querySelector('#attach').disabled=!authorized||!active||!loaded||Boolean(pending);}
function resize(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,180)+'px';}
function failure(error,prefix=''){
  setStatus(prefix+error.message,'error');
  document.querySelector('#error-text').textContent=error.message;document.querySelector('#error-notice').hidden=false;
  setConnection(error.auth?'Access required':error.network?'Connection lost':'Request failed','error');
  controls();
}
document.querySelector('#error-close').onclick=()=>{document.querySelector('#error-notice').hidden=true;};
async function api(path,data,raw=false){
  let response;
  try{response=await fetch(path,{method:'POST',headers:{'Content-Type':raw?data.type:'application/json','X-Chat-Token':token},body:raw?data:JSON.stringify(data)});}
  catch{throw Object.assign(Error('Cannot reach Local Chat. Check that qwen chat is still running, then try again.'),{network:true});}
  if(response.status===401||response.status===403){authorized=false;throw Object.assign(Error('Chat access expired or is invalid. Open the latest local Chat link printed by Backtrackify.'),{auth:true});}
  let result;
  try{result=await response.json();}catch{throw Error('Local Chat returned an unreadable response. Try refreshing the page.');}
  if(!response.ok)throw Error(result.error||'The Chat request failed. Your message has been kept.');
  setConnection('Connected','good');return result;
}
const imageDrafts=new Map(),historyImageURLs=new Set();
const draftView=document.querySelector('#image-drafts'),fileInput=document.querySelector('#image-files'),imageDialog=document.querySelector('#image-view');
function clearDraftImages(id){for(const image of imageDrafts.get(id)||[])URL.revokeObjectURL(image.url);imageDrafts.delete(id);if(active===id)renderDraftImages();}
function clearHistoryImages(){for(const url of historyImageURLs)URL.revokeObjectURL(url);historyImageURLs.clear();}
function renderDraftImages(){
  draftView.replaceChildren();const owner=active;
  for(const image of imageDrafts.get(owner)||[]){
    const box=document.createElement('div'),picture=document.createElement('img'),remove=document.createElement('button');box.className='image-draft';picture.src=image.url;picture.alt='Attached image';remove.type='button';remove.textContent='X';remove.setAttribute('aria-label','Remove attached image');
    remove.onclick=()=>{if(pending)return;const rows=imageDrafts.get(owner)||[];imageDrafts.set(owner,rows.filter(row=>row!==image));URL.revokeObjectURL(image.url);renderDraftImages();};box.append(picture,remove);draftView.append(box);
  }
}
function attachFiles(files){
  if(!active||!loaded||pending)return;
  const rows=imageDrafts.get(active)||[];
  if(rows.length+files.length>2){failure(Error('Attach at most two images per message.'));return;}
  for(const file of files){if(!['image/png','image/jpeg'].includes(file.type)||!file.size||file.size>8*1024*1024){failure(Error('Choose a PNG or JPEG image up to 8 MiB.'));return;}}
  for(const file of files)rows.push({file,url:URL.createObjectURL(file)});
  imageDrafts.set(active,rows);renderDraftImages();
}
document.querySelector('#attach').onclick=()=>fileInput.click();fileInput.onchange=()=>{attachFiles([...fileInput.files]);fileInput.value='';};
const dropZone=document.querySelector('#chat-content');let dragDepth=0;
function fileDrag(event){return [...(event.dataTransfer?.types||[])].includes('Files');}
function imageDrag(event){for(const item of event.dataTransfer?.items||[]){if(item.kind==='file'&&['image/png','image/jpeg'].includes(item.type))return true;}return false;}
function clearDrop(){dragDepth=0;dropZone.dataset.drag='';}
dropZone.ondragenter=event=>{if(!fileDrag(event))return;event.preventDefault();dragDepth++;if(active&&loaded&&!pending&&imageDrag(event))dropZone.dataset.drag='true';};
dropZone.ondragover=event=>{if(fileDrag(event)){event.preventDefault();event.dataTransfer.dropEffect=active&&loaded&&!pending?'copy':'none';}};
dropZone.ondragleave=()=>{dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)clearDrop();};
dropZone.ondrop=event=>{if(!fileDrag(event))return;event.preventDefault();clearDrop();attachFiles([...event.dataTransfer.files]);};
document.addEventListener('dragover',event=>{if(fileDrag(event))event.preventDefault();});
document.addEventListener('drop',event=>{if(fileDrag(event)){event.preventDefault();clearDrop();}});
document.addEventListener('dragend',clearDrop);window.addEventListener('blur',clearDrop);
async function imageBlob(owner,image,thumbnail=false){
  let response;
  try{response=await fetch('/image',{method:'POST',headers:{'Content-Type':'application/json','X-Chat-Token':token},body:JSON.stringify({id:owner,image,thumbnail})});}catch{throw Error('Cannot load the saved image. Check the Chat connection.');}
  if(response.status===403){authorized=false;throw Object.assign(Error('Chat access expired. Open the latest local Chat link.'),{auth:true});}
  if(!response.ok){const error=await response.json();throw Error(error.error||'Saved image is unavailable.');}
  return response.blob();
}
imageDialog.querySelector('button').onclick=()=>imageDialog.close();
imageDialog.addEventListener('close',()=>{const picture=imageDialog.querySelector('img');URL.revokeObjectURL(picture.src);picture.removeAttribute('src');});
function renderImages(article,ids,owner,version){
  const group=document.createElement('div');group.className='message-images';article.append(group);
  for(const id of ids){
    const box=document.createElement('div'),open=document.createElement('button'),picture=document.createElement('img'),reuse=document.createElement('button');box.className='message-image';open.type=reuse.type='button';open.setAttribute('aria-label','View attached image');picture.alt='Saved attachment';picture.loading='lazy';open.append(picture);reuse.textContent='Use again';box.append(open,reuse);group.append(box);
    imageBlob(owner,id,true).then(blob=>{if(active!==owner||selection!==version)return;const url=URL.createObjectURL(blob);historyImageURLs.add(url);picture.src=url;}).catch(error=>{if(active===owner&&selection===version){const note=document.createElement('small');note.textContent=error.message;box.append(note);}});
    open.onclick=async()=>{try{const blob=await imageBlob(owner,id);if(active!==owner)return;imageDialog.querySelector('img').src=URL.createObjectURL(blob);imageDialog.showModal();}catch(error){failure(error);}};
    reuse.onclick=async()=>{if(pending)return;try{const rows=imageDrafts.get(owner)||[];if(rows.length>=2||rows.some(row=>row.id===id))throw Error('Attach at most two distinct images per message.');const blob=await imageBlob(owner,id);if(active!==owner||pending)return;const current=imageDrafts.get(owner)||[];if(current.length>=2||current.some(row=>row.id===id))throw Error('Attach at most two distinct images per message.');current.push({id,url:URL.createObjectURL(blob)});imageDrafts.set(owner,current);renderDraftImages();input.focus();}catch(error){failure(error);}};
  }
}
function inline(parent,text){
  const pattern=/`([^`\r\n]+)`|\*\*([^*\r\n]+)\*\*/g;let start=0;
  for(const match of text.matchAll(pattern)){
    parent.append(document.createTextNode(text.slice(start,match.index)));
    const node=document.createElement(match[1]!==undefined?'code':'strong');node.textContent=match[1]??match[2];parent.append(node);start=match.index+match[0].length;
  }

function codeBlock(parent,content,language){
  const frame=document.createElement('div'),bar=document.createElement('div'),name=document.createElement('span');
  frame.className='code-frame';bar.className='code-bar';name.textContent=language.trim().slice(0,80)||'Code';
  const button=document.createElement('button');button.type='button';button.className='copy';button.textContent='Copy';button.setAttribute('aria-label','Copy code');
  button.onclick=async()=>{try{await navigator.clipboard.writeText(content);button.textContent='Copied';}catch{button.textContent='Copy unavailable';}setTimeout(()=>button.textContent='Copy',2000);};
  const pre=document.createElement('pre'),code=document.createElement('code');code.textContent=content;pre.append(code);bar.append(name,button);frame.append(bar,pre);parent.append(frame);

function markdown(parent,text){
  // Keep original line endings inside code; every untrusted value is a text node.
  const lines=text.match(/[^\r\n]*(?:\r\n|\r|\n|$)/g)||[];
  const clean=line=>line.replace(/[\r\n]+$/,'');let paragraph=[];
  function flush(){if(paragraph.length){const p=document.createElement('p');inline(p,paragraph.join('').replace(/(?:\r\n|\r|\n)$/,''));parent.append(p);paragraph=[];}}
  for(let i=0;i<lines.length;){
    const line=clean(lines[i]),fence=line.match(/^ {0,3}(`{3,}|~{3,})(.*)$/);
    if(fence){flush();const close=new RegExp('^ {0,3}'+fence[1][0]+'{'+fence[1].length+',}\\s*$'),body=[];i++;
      while(i<lines.length&&!close.test(clean(lines[i])))body.push(lines[i++]);
      if(i<lines.length)i++;codeBlock(parent,body.join(''),fence[2]);continue;
    }
    if(!line.trim()){flush();i++;continue;}
    const heading=line.match(/^ {0,3}(#{1,6})\s+(.+)$/);
    if(heading){flush();const h=document.createElement('h'+Math.min(heading[1].length+1,6));inline(h,heading[2]);parent.append(h);i++;continue;}
    const item=line.match(/^ {0,3}([-*+]|\d+[.)])\s+(.+)$/);
    if(item){flush();const ordered=/^\d/.test(item[1]),list=document.createElement(ordered?'ol':'ul');
      while(i<lines.length){const next=clean(lines[i]).match(/^ {0,3}([-*+]|\d+[.)])\s+(.+)$/);if(!next||/^\d/.test(next[1])!==ordered)break;const li=document.createElement('li');inline(li,next[2]);list.append(li);i++;}
      parent.append(list);continue;
    }
    paragraph.push(lines[i++]);
  }
  flush();
}
function messageNode(turn,index){
  const article=document.createElement('article'),role=document.createElement('div'),body=document.createElement('div');
  article.className='message '+(turn.role==='user'?'user':'assistant');article.dataset.role=turn.role;article.dataset.index=index;
  role.className='message-role';role.textContent=turn.role==='user'?'You':'Backtrackify';body.className='message-body';
  markdown(body,turn.content);article.append(role,body);
  if(turn.images?.length)renderImages(article,turn.images,active,selection);
  return article;
}
const older=document.createElement('button');older.id='older';older.type='button';older.textContent='Load earlier messages';older.onclick=loadOlder;
function emptyHistory(){
  clearHistoryImages();renderDraftImages();
  view.replaceChildren();
    const empty=document.createElement('div');empty.className='empty';
    const mark=document.createElement('div');mark.className='brand-mark';mark.textContent='B';mark.setAttribute('aria-hidden','true');
    const h=document.createElement('h2');h.textContent='Start a conversation';const p=document.createElement('p');p.textContent='Ask a question, work through an idea, or paste a code snippet.';empty.append(mark,h,p);view.append(empty);
}
function renderHistory(data,append=false){
  if(data.id!==active)return;
  const bottom=timeline.scrollHeight-timeline.scrollTop-timeline.clientHeight<80;
  // A normal response overlaps the current tail; retain already displayed history.
  const extend=append&&shownEnd>=data.start&&shownEnd<=data.end&&view.querySelector('.message');
  if(!extend){clearHistoryImages();view.replaceChildren(older);shownStart=data.start;shownEnd=data.start;}
  for(let i=Math.max(shownEnd,data.start);i<data.end;i++)view.append(messageNode(data.turns[i-data.start],i));
  shownEnd=data.end;currentRevision=data.revision;older.hidden=shownStart===0;
  if(!data.total)emptyHistory();
  document.querySelector('#rollovers').textContent='Rollovers '+data.rollovers;
  document.querySelector('#context').textContent='Context —';
  if(!append||bottom)timeline.scrollTop=timeline.scrollHeight;
}
async function loadOlder(){
  if(!loaded||!shownStart||olderBusy)return;
  const id=active,version=selection,before=shownStart;olderBusy=true;older.disabled=true;
  try{
    const data=await api('/history',{id,limit:pageSize,before});
    if(active!==id||version!==selection||shownStart!==data.end)return;
    const height=timeline.scrollHeight,top=timeline.scrollTop,fragment=document.createDocumentFragment();
    data.turns.forEach((turn,i)=>fragment.append(messageNode(turn,data.start+i)));
    older.after(fragment);shownStart=data.start;older.hidden=shownStart===0;
    timeline.scrollTop=top+timeline.scrollHeight-height;
  }catch(error){failure(error);}
  finally{olderBusy=false;older.disabled=false;}
}
if('IntersectionObserver' in window)new IntersectionObserver(entries=>{if(entries.some(e=>e.isIntersecting))loadOlder();},{root:timeline,rootMargin:'120px 0px 0px'}).observe(older);
async function measure(id,version){
  try{
    const data=await api('/stats',{id});
    if(active!==id||selection!==version||currentRevision!==data.revision)return;
    document.querySelector('#context').textContent='Context '+(data.context_percent===null?'—':data.context_percent+'%');
    document.querySelector('#rollovers').textContent='Rollovers '+data.rollovers;
  }catch(error){if(error.auth||active===id&&selection===version)failure(error);/* Unavailable measurements return null; request failures stay visible. */}
}
function renderList(rows){
  closeMenu();conversations=rows;nav.replaceChildren();
  for(const row of rows){
    const wrapper=document.createElement('div'),button=document.createElement('button'),toggle=document.createElement('button');
    wrapper.className='conversation-row';button.className='conversation-select';button.type='button';button.textContent=row.title+(row.error?' · unavailable':'');button.title=row.title;button.dataset.id=row.id;button.dataset.unavailable=Boolean(row.error);button.setAttribute('aria-pressed',String(row.id===active));button.onclick=()=>select(row.id);
    toggle.type='button';toggle.className='menu-toggle';toggle.setAttribute('aria-label','Manage '+row.title);toggle.setAttribute('aria-expanded','false');toggle.setAttribute('aria-haspopup','menu');toggle.setAttribute('aria-controls','conversation-menu');
    const dots=document.createElement('span');dots.className='menu-dots';dots.setAttribute('aria-hidden','true');for(let i=0;i<3;i++)dots.append(document.createElement('i'));toggle.append(dots);
    toggle.onclick=()=>showMenu(row,toggle);toggle.onkeydown=event=>{if(event.key==='ArrowDown'){event.preventDefault();showMenu(row,toggle);}};
    wrapper.append(button,toggle);nav.append(wrapper);
  }
  const row=rows.find(row=>row.id===active);title.textContent=row?.title||'New conversation';
  const started=row?.created_at?new Date(row.created_at):null;
  document.querySelector('#started').textContent=started&&!Number.isNaN(started.getTime())?'Started '+new Intl.DateTimeFormat(undefined,{dateStyle:'medium',timeStyle:'short'}).format(started):'Start time unavailable';
  controls();
}
const menu=document.querySelector('#conversation-menu');let menuTrigger=null,menuRow=null;
function closeMenu(restore=false){if(!menuTrigger)return;const trigger=menuTrigger;trigger.setAttribute('aria-expanded','false');menuTrigger=null;menuRow=null;menu.hidePopover();if(restore)trigger.focus();}
function showMenu(row,trigger){
  if(menuTrigger===trigger){closeMenu();return;}closeMenu();menuRow=row;menuTrigger=trigger;
  const buttons=[document.querySelector('#menu-rename'),document.querySelector('#menu-delete')];buttons[0].disabled=Boolean(row.error)||pending===row.id;buttons[1].disabled=Boolean(row.error&&!row.legacy)||pending===row.id;
  trigger.setAttribute('aria-expanded','true');menu.showPopover();
  const rect=trigger.getBoundingClientRect();menu.style.left=Math.max(8,Math.min(rect.right-menu.offsetWidth,innerWidth-menu.offsetWidth-8))+'px';
  menu.style.top=Math.max(8,rect.bottom+menu.offsetHeight+4<=innerHeight-8?rect.bottom+4:rect.top-menu.offsetHeight-4)+'px';
  (buttons.find(b=>!b.disabled)||trigger).focus();
}
menu.addEventListener('toggle',event=>{if(event.newState==='closed'&&!menu.matches(':popover-open'))closeMenu();});
menu.onkeydown=event=>{if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();const buttons=[...menu.querySelectorAll('button')].filter(b=>!b.disabled);if(buttons.length)buttons[(buttons.indexOf(document.activeElement)+1)%buttons.length].focus();}};
document.addEventListener('keydown',event=>{if(event.key==='Escape'){closeMenu(true);clearDrop();}});
window.addEventListener('resize',()=>closeMenu());window.addEventListener('scroll',event=>{if(event.target===nav||event.target===document)closeMenu();},true);
for(const [id,action] of [['#menu-rename','Rename'],['#menu-delete','Delete']])document.querySelector(id).onclick=()=>{const row=menuRow;closeMenu();if(row)openManage(row,action);};
const dialog=document.querySelector('#manage'),renameInput=document.querySelector('#rename-title');
function openManage(row,action){
  if(pending===row.id){failure(Error('Conversation is busy. Wait for the current response to finish.'));return;}
  managing={...row,action};document.querySelector('#manage-title').textContent=action+' conversation';
  document.querySelector('#manage-description').textContent=action==='Delete'?'Permanently delete this conversation and its saved history? Other conversations and the legacy original are preserved.':'Change the display title. The original goal and messages stay unchanged.';
  renameInput.hidden=action!=='Rename';renameInput.value=row.title;
  const confirm=document.querySelector('#manage-confirm');confirm.textContent=action==='Delete'?'Delete conversation':'Save title';confirm.className=action==='Delete'?'delete-action':'';dialog.showModal();
  if(action==='Rename'){renameInput.focus();renameInput.select();}
  else document.querySelector('#manage-cancel').focus();
}
document.querySelector('#delete-all').onclick=()=>{
  if(pending||!conversations.length)return;
  managing={action:'Delete all',revision:listRevision};renameInput.hidden=true;
  document.querySelector('#manage-title').textContent='Delete all chats?';document.querySelector('#manage-description').textContent='Permanently remove all '+conversations.length+' browser Chat conversations and their saved histories? CLI conversations, harness tasks and the legacy original are preserved.';
  const button=document.querySelector('#manage-confirm');button.textContent='Delete all chats';button.className='delete-action';dialog.showModal();document.querySelector('#manage-cancel').focus();
};
function clearSelection(){active=null;loaded=false;selection++;input.value='';currentRevision='';shownStart=shownEnd=0;remember('sessionStorage',activeKey,'');clearHistoryImages();renderDraftImages();}
document.querySelector('#manage-cancel').onclick=()=>dialog.close();
document.querySelector('#manage-confirm').onclick=async()=>{
  const row=managing,button=document.querySelector('#manage-confirm');if(!row||pending===row.id)return;
  button.disabled=true;
  try{
    if(row.action==='Rename'){
      await api('/rename',{id:row.id,title:renameInput.value});await refresh();setStatus('Title saved','good');
    }else{
      if(row.action==='Delete all'){await api('/delete-all',{confirm:true,revision:row.revision});drafts.clear();for(const id of imageDrafts.keys())clearDraftImages(id);clearSelection();}
      else{await api('/delete',{id:row.id,confirm:true,revision:row.revision});drafts.delete(row.id);clearDraftImages(row.id);if(active===row.id)clearSelection();}
      const rows=await refresh();
      if(!active){if(rows.length)await select((rows.find(r=>!r.error)||rows[0]).id);else{emptyHistory();setStatus('Create a new conversation to begin');document.querySelector('#context').textContent='Context —';document.querySelector('#rollovers').textContent='Rollovers 0';}}
    }
    dialog.close();controls();
  }catch(error){failure(error);if(row.action==='Delete all'){try{const rows=await refresh();if(active&&!rows.some(r=>r.id===active)){clearSelection();emptyHistory();controls();}}catch{}}}
  finally{button.disabled=false;}
};
async function refresh(){const data=await api('/conversations',{});listRevision=data.revision;renderList(data.conversations);return data.conversations;}
async function select(id){
  clearDrop();
  if(active)drafts.set(active,input.value);
  active=id;loaded=false;const version=++selection;input.value=drafts.get(id)||'';resize();shownStart=shownEnd=0;currentRevision='';
  clearHistoryImages();renderDraftImages();
  document.querySelector('#context').textContent='Context —';document.querySelector('#rollovers').textContent='Rollovers —';
  setStatus('Loading conversation…');controls();view.replaceChildren();renderList(conversations);

    const data=await api('/history',{id,limit:pageSize});if(active!==id||selection!==version)return;
    if(data.unavailable){const notice=document.createElement('p');notice.className='empty';notice.textContent=data.unavailable;view.replaceChildren(notice);currentRevision=data.revision;setStatus('Legacy v2 conversation — use its menu to delete it');controls();return;}
    renderHistory(data);loaded=true;remember('sessionStorage',activeKey,id);
    setStatus(pending===id?'Generating response…':'History loaded'+(data.rollovers?' · '+data.rollovers+' context rollover(s)':''));controls();
    document.querySelector('#app').dataset.sidebar='';document.querySelector('#sidebar-toggle').setAttribute('aria-expanded','false');
    measure(id,version);
  }catch(error){if(active===id&&selection===version)failure(error);}
}
async function create(){
  creating=true;controls();setStatus('Creating conversation…');
  try{const data=await api('/new',{});await refresh();await select(data.id);}catch(error){failure(error);}
  finally{creating=false;controls();}
}
fresh.onclick=create;
document.querySelector('#sidebar-toggle').onclick=()=>{const app=document.querySelector('#app'),open=app.dataset.sidebar!=='open';app.dataset.sidebar=open?'open':'';document.querySelector('#sidebar-toggle').setAttribute('aria-expanded',String(open));};
input.oninput=()=>{if(active)drafts.set(active,input.value);resize();controls();};
input.onkeydown=event=>{if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing&&!event.ctrlKey&&!event.altKey&&!event.metaKey){event.preventDefault();if(!send.disabled)form.requestSubmit();}};
form.onsubmit=async event=>{
  event.preventDefault();if(!active||!loaded||pending||!authorized||!input.value.trim())return;
  const id=active,message=input.value;drafts.set(id,message);pending=id;controls();setStatus('Generating response…');
  let saved=false;
  try{
    const ids=[];
    for(const image of imageDrafts.get(id)||[]){if(image.file){const result=await api('/upload?id='+encodeURIComponent(id),image.file,true);ids.push(result.image);}else ids.push(image.id);}
    const body={id,message,limit:pageSize};if(ids.length)body.images=ids;
    const data=await api('/send',body);saved=true;clearDraftImages(id);
    if(drafts.get(id)===message)drafts.set(id,'');
    if(active===id){renderHistory(data,true);if(input.value===message){input.value='';resize();}setStatus('Saved locally'+(data.rollovers?' · '+data.rollovers+' context rollover(s)':''),'good');measure(id,selection);}
  }catch(error){failure(error);}
  finally{pending=null;controls();}
  if(saved){try{await refresh();}catch(error){failure(error,active===id?'Response saved. Conversation list refresh failed: ':'Conversation list refresh failed: ');}}

async function initialize(){
  controls();
  if(!token){failure(Object.assign(Error('Authentication required. Open the local Chat link printed by Backtrackify.'),{auth:true}));return;}
  try{const rows=await refresh(),previous=stored('sessionStorage',activeKey);if(rows.length)await select((rows.find(row=>row.id===previous&&!row.error)||rows.find(row=>!row.error)||rows[0]).id);else{emptyHistory();setStatus('Create a new conversation to begin');}}
  catch(error){failure(error);}
}
initialize();
let heartbeatBusy=false;
async function heartbeat(){
  if(!authorized||heartbeatBusy||pending)return;heartbeatBusy=true;
  try{await api('/heartbeat',{});}catch(error){failure(error);}finally{heartbeatBusy=false;}
}
window.setInterval(heartbeat,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)heartbeat();});
window.addEventListener('focus',heartbeat);
</script>
